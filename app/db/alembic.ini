# =============================================================================
# FoodLence — Alembic Configuration
# Knowledge Base & Application Database Migrations
# SE5104 Mini Project, Group 14 — Sabaragamuwa University of Sri Lanka
# Lead: S.K.P.H. Deemantha (Knowledge Base Lead)
# =============================================================================

[alembic]
# Path to migration environment scripts
script_location = %(here)s/alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Sys.path prepends
prepend_sys_path = .

# Timezone for revision timestamps
# timezone = UTC

# Max length of characters for the slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# corresponding .py to be detected as revisions
sourceless = false

# Database connection URL (Default development fallback or Neon Direct URL)
# Note: In production or CI/CD, set DATABASE_URL in your environment.
# IMPORTANT: For Neon, use the DIRECT connection string for migrations (port 5432, without -pooler).
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/foodlence_db

[post_write_hooks]
# Post-write hooks for formatting generated code (e.g., black, ruff)

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
